---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
  SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

jobs:
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings
        shell: bash

  flutter-build-android:
    name: "Release for android arm64"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Echo build progress
        run: echo "Kazumi_android_arm64-v8a_${{ env.tag }}.apk build progress"
        shell: bash
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - name: Build Flutter for Android arm64
        run: >-
          flutter build apk --split-per-abi --target-platform android-arm64
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
        shell: bash
      - name: Package android arm64 build output
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_arm64-v8a_${{ env.tag }}.apk
        shell: bash
      - name: Upload android outputs
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: Kazumi_android_arm64-v8a_*.apk

  flutter-build-windows:
    name: "Release for windows zip"
    runs-on: "windows-latest"
    needs: [flutter-test, flutter-analyze]
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          } else {
            $tag = "latest"
          }
          echo "tag=$tag" >> $env:GITHUB_ENV
      - run: echo "Kazumi_windows_${env:tag}.zip build progress"
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'
      - run: flutter pub get
      - run: >-
          flutter build windows
          --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
      - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows_${env:tag}.zip
      - name: Upload windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: Kazumi_windows_*.zip

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-windows]
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Android build tools
        run: sdkmanager "build-tools;34.0.0"

      - name: Download windows zip build file
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: windows_outputs
      - name: Copy windows build file to root
        run: cp windows_outputs/* Kazumi_windows_${{ env.tag }}.zip

      - name: Download android build file
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: android_outputs
      - name: Prepare android build file
        run: |
          mkdir -p build/unsigned build/signed
          cp android_outputs/* build/unsigned/Kazumi_android_arm64-v8a_${{ env.tag }}.apk
          cp android_outputs/* build/signed/Kazumi_android_arm64-v8a_${{ env.tag }}.apk

      - name: Sign APK
        if: ${{ env.SIGNING_KEY_BASE64 != '' }}
        id: sign_app
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: build/unsigned
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Copy Signed android build file
        if: ${{ env.SIGNING_KEY_BASE64 != '' }}
        run: cp ${{ steps.sign_app.outputs.signedReleaseFile }} build/signed/Kazumi_android_arm64-v8a_${{ env.tag }}.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Release ${{ env.tag }}"
          files: |
            build/signed/*.apk
            Kazumi_windows_*.zip
